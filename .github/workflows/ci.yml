name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No toolchain version here on purpose: rust-toolchain.toml is the single
      # source of truth, so CI and every developer compile with the same rustc.
      # A floating "stable" would silently re-key the delegate on each Rust
      # release, because rustc bakes /rustc/<commit>/ into the binary.
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: workspace — fmt / clippy / test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # `testvec` is off by default so it never reaches a contract WASM, which
      # means --all-targets above skips the example that requires it.
      - name: feature-gated targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The delegate and the contracts are separate crates (own Cargo.lock) so
      # a workspace `cargo update` cannot re-key them. Check each on its own.
      - name: standalone crates — fmt / clippy / test
        run: |
          for d in ante-delegate contracts/ante-registry examples/guestbook/contract; do
            echo "== $d =="
            (cd "$d" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test)
          done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the pinned toolchain
        run: rustup show          # rust-toolchain.toml carries the wasm target
      - uses: Swatinem/rust-cache@v2

      # build-delegate.sh greps the WASM for absolute registry paths and fails
      # if any leaked — the reproducibility guard. Then regenerate embedded.ts.
      - name: build the delegate + embed it
        run: ./scripts/sync-delegate.sh

      # Agreement with artifact-keys.toml is checked in the `reproducible` job
      # below, which builds at a fixed path in a container. It could not be
      # checked HERE, and that was the whole problem: cargo hashes a path
      # dependency's absolute path into -C metadata, so ante-core at
      # /home/runner/work/... and at ~/projects/ante produce different bytes and
      # no --remap-path-prefix reaches it. The committed record was therefore
      # verifiable on exactly one machine by exactly one person — which is how
      # it came to record keys that no clean build reproduced.
      #
      # What this job still proves, cheaply and on every push: the build is
      # deterministic, and it leaks no machine paths.

      # The delegate key is blake3(wasm), and it is the namespace every user's
      # identity is stored under: a build that is not byte-stable silently
      # strands identities on every rebuild. Prove it here rather than finding
      # out in production.
      - name: the delegate build is byte-reproducible
        run: |
          first=$(sha256sum ante-delegate/target/wasm32-unknown-unknown/release/ante_delegate.wasm | cut -d' ' -f1)
          rm -rf ante-delegate/target/wasm32-unknown-unknown
          ./scripts/build-delegate.sh >/dev/null
          second=$(sha256sum ante-delegate/target/wasm32-unknown-unknown/release/ante_delegate.wasm | cut -d' ' -f1)
          echo "1: $first"
          echo "2: $second"
          [ "$first" = "$second" ] || {
            echo "::error::the delegate WASM is not byte-reproducible — its key, and every stored identity, would move on rebuild" >&2
            exit 1
          }

      - name: build the contract WASMs (reproducible)
        run: |
          (cd contracts/ante-registry && ../../scripts/build-contract.sh)
          (cd examples/guestbook/contract && ../../../scripts/build-contract.sh)

      - name: upload embedded.ts for the web job
        uses: actions/upload-artifact@v4
        with:
          name: embedded
          path: client/src/embedded.ts

  # The claim ante makes is that you do not have to trust the publisher, because
  # every address is derived from bytes you can rebuild. This job is what makes
  # that true for someone who is not the publisher: a fixed-path container build,
  # compared against the committed record. Proven to give identical keys from a
  # different host directory and with --no-cache.
  reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the published keys are reproducible from source
        run: ./scripts/build-in-container.sh --check

  # The merge laws are the one property whose violation cannot be repaired after
  # the fact. A contract whose merge is not associative, commutative and
  # idempotent never converges: two peers given the same updates in different
  # orders hold different state and heal forever. Fixing it means changing the
  # WASM, which changes the address, which strands everything already stored —
  # so this has to be a gate, not a pre-publish ritual someone remembers.
  #
  # ante-core's own tests cover the same properties on the Rust types every
  # commit; this runs the verifier the NETWORK runs, against the compiled WASM.
  merge-laws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: install fdev
        run: |
          curl -fsSL https://freenet.org/install.sh | FREENET_NO_SERVICE=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the contracts obey the merge laws
        run: ./scripts/verify-merge.sh

  web:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: embedded
          path: client/src

      - run: npm ci
      - name: docs and apps agree on every live address
        run: ./scripts/check-deployments.sh
      - name: typecheck (all workspaces)
        run: npm run typecheck
      - name: cross-impl guard (TS verifier vs the pinned Rust vector)
        run: npm test
      - name: build the UIs
        run: npm run build
