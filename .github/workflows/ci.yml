name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain version here on purpose: rust-toolchain.toml is the single
      # source of truth, so CI and every developer compile with the same rustc.
      # A floating "stable" would silently re-key the delegate on each Rust
      # release, because rustc bakes /rustc/<commit>/ into the binary.
      - name: install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: workspace — fmt / clippy / test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      # `testvec` is off by default so it never reaches a contract WASM, which
      # means --all-targets above skips the example that requires it.
      - name: feature-gated targets
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The delegate and the contracts are separate crates (own Cargo.lock) so
      # a workspace `cargo update` cannot re-key them. Check each on its own.
      - name: standalone crates — fmt / clippy / test
        run: |
          for d in ante-delegate contracts/ante-registry examples/guestbook/contract; do
            echo "== $d =="
            (cd "$d" && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test)
          done

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the pinned toolchain
        run: rustup show          # rust-toolchain.toml carries the wasm target
      - uses: Swatinem/rust-cache@v2

      # build-delegate.sh greps the WASM for absolute registry paths and fails
      # if any leaked — the reproducibility guard. Then regenerate embedded.ts.
      - name: build the delegate + embed it
        run: ./scripts/sync-delegate.sh

      # NOT checked here: agreement with artifact-keys.toml. That file records
      # what the *publisher's* machine builds, and CI can never match it —
      # cargo hashes a path dependency's absolute path into -C metadata, so
      # ante-core at /home/runner/work/... and ante-core at ~/projects/ante
      # produce differently-laid-out (though string-identical) WASM. No
      # --remap-path-prefix reaches that. See DESIGN.md.
      #
      # What CI *can* prove is below: the build is deterministic, and it leaks
      # no machine paths. The committed record stays a pre-publish check run by
      # whoever publishes (scripts/check-keys.sh, and sync-delegate.sh warns).

      # The delegate key is blake3(wasm), and it is the namespace every user's
      # identity is stored under: a build that is not byte-stable silently
      # strands identities on every rebuild. Prove it here rather than finding
      # out in production.
      - name: the delegate build is byte-reproducible
        run: |
          first=$(sha256sum ante-delegate/target/wasm32-unknown-unknown/release/ante_delegate.wasm | cut -d' ' -f1)
          rm -rf ante-delegate/target/wasm32-unknown-unknown
          ./scripts/build-delegate.sh >/dev/null
          second=$(sha256sum ante-delegate/target/wasm32-unknown-unknown/release/ante_delegate.wasm | cut -d' ' -f1)
          echo "1: $first"
          echo "2: $second"
          [ "$first" = "$second" ] || {
            echo "::error::the delegate WASM is not byte-reproducible — its key, and every stored identity, would move on rebuild" >&2
            exit 1
          }

      - name: build the contract WASMs (reproducible)
        run: |
          (cd contracts/ante-registry && ../../scripts/build-contract.sh)
          (cd examples/guestbook/contract && ../../../scripts/build-contract.sh)

      - name: upload embedded.ts for the web job
        uses: actions/upload-artifact@v4
        with:
          name: embedded
          path: client/src/embedded.ts

  web:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: embedded
          path: client/src

      - run: npm ci
      - name: docs and apps agree on every live address
        run: ./scripts/check-deployments.sh
      - name: typecheck (all workspaces)
        run: npm run typecheck
      - name: cross-impl guard (TS verifier vs the pinned Rust vector)
        run: npm test
      - name: build the UIs
        run: npm run build
